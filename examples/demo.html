ing-demo .hero { padding: 96px 16px; background: #f1f5f9; }\n.dynamic-landing-demo .block { padding: 320px 16px; }", "dataBindings": [{"selector": "#hero_title", "value": "Landing de ejemplo"}, {"selector": "#footer_year", "value": "2026"}]}], "Secciones (static / dynamic)": [{"id_DocumentHTMLCSS": "nav", "renderType": "static", "htmlComponent": "\u003cnav class=\"navbar navbar-dark bg-dark px-3\">\u003cspan class=\"navbar-brand\">Mi sitio\u003c/span>\u003cspan class=\"navbar-text\">static: cambiarla recarga toda la pantalla\u003c/span>\u003c/nav>"}, {"id_DocumentHTMLCSS": "datos", "renderType": "dynamic", "formId": "datos", "htmlComponent": "\u003cform class=\"p-3\">\u003clabel class=\"form-label\" for=\"nombre\">Escribe algo aquí (se conserva si actualizas otra dinámica, se pierde si cambias una estática)\u003c/label>\u003cinput id=\"nombre\" name=\"nombre\" class=\"form-control\" />\u003c/form>", "formMappings": [{"controlName": "nombre", "domSelector": "#nombre"}]}, {"id_DocumentHTMLCSS": "novedades", "renderType": "dynamic", "htmlComponent": "\u003cdiv class=\"alert alert-info m-3\">\u003cstrong>novedades\u003c/strong> (dynamic): \u003cspan>Sin novedades.\u003c/span>\u003c/div>"}, {"id_DocumentHTMLCSS": "pie", "renderType": "static", "htmlComponent": "\u003cfooter class=\"p-3 text-center text-muted\">Pie de página: es static y va último en el JSON, así que se pinta al final.\u003c/footer>"}], "Autocompletado": [{"id_DocumentHTMLCSS": "autocompletado", "renderType": "dynamic", "formId": "autocompletado", "htmlComponent": "\u003cform class=\"p-3\" style=\"max-width: 560px; margin: auto\">\u003ch4>Autocompletado\u003c/h4>\u003cp class=\"text-muted\">Escribe al menos 2 letras (por ejemplo \u003ccode>cor\u003c/code> o \u003ccode>san\u003c/code>). Las sugerencias vienen de \u003ccode>GET /api/ciudades?q=…\u003c/code>: necesita \u003ccode>npm run mock-api\u003c/code> corriendo.\u003c/p>\u003cdiv class=\"mb-3\">\u003clabel class=\"form-label\" for=\"ciudad\">Ciudad (sugerencias desde el servidor)\u003c/label>\u003cinput id=\"ciudad\" class=\"form-control\" autocomplete=\"off\" />\u003c/div>\u003cdiv class=\"mb-3\">\u003clabel class=\"form-label\" for=\"color\">Color (lista fija)\u003c/label>\u003cinput id=\"color\" class=\"form-control\" autocomplete=\"off\" />\u003c/div>\u003c/form>", "formMappings": [{"controlName": "ciudad", "domSelector": "#ciudad", "autoCompleteConfig": {"sourceUrl": "/api/ciudades", "queryParam": "q", "minChars": 2, "debounceTime": 250}}, {"controlName": "color", "domSelector": "#color", "autoCompleteConfig": {"source": ["Rojo", "Verde", "Azul", "Amarillo", "Violeta", "Naranja"]}}]}], "Subida de archivos": [{"id_DocumentHTMLCSS": "archivos", "renderType": "dynamic", "formId": "archivos", "htmlComponent": "\u003cform class=\"p-3\" style=\"max-width: 640px; margin: auto\">\u003ch4>Subida de archivos\u003c/h4>\u003cp class=\"text-muted\">Prueba con \u003ccode>npm run mock-api\u003c/code> corriendo. Un nombre con \"fallo\" devuelve 500, con \"grande\" un 413 y con \"vacio\" una respuesta sin cuerpo.\u003c/p>\u003cdiv class=\"mb-3\">\u003clabel class=\"form-label\" for=\"contrato\">Contrato (PDF o imagen, máx. 2 MB)\u003c/label>\u003cinput id=\"contrato\" type=\"file\" class=\"form-control\" />\u003cprogress id=\"avance_contrato\" class=\"w-100 mt-2\" value=\"0\" max=\"100\">\u003c/progress>\u003cul id=\"lista_contrato\" class=\"small mb-0\">\u003c/ul>\u003cdiv class=\"invalid-feedback d-block\" data-error-for=\"contrato\">\u003c/div>\u003c/div>\u003cdiv class=\"mb-3\">\u003clabel class=\"form-label\" for=\"fotos\">Fotos (hasta 3, solo imágenes)\u003c/label>\u003cinput id=\"fotos\" type=\"file\" class=\"form-control\" />\u003cspan id=\"avance_fotos\" class=\"small text-muted\">\u003c/span>\u003cul id=\"lista_fotos\" class=\"small mb-0\">\u003c/ul>\u003cdiv class=\"invalid-feedback d-block\" data-error-for=\"fotos\">\u003c/div>\u003c/div>\u003cbutton id=\"enviar\" type=\"submit\" class=\"btn btn-primary w-100\">E const viewer=document.getElementById('viewer'),sel=document.getElementById('example'),log=document.getElementById('log'),status=document.getElementById('status');
let current=[];
const EVENTS=['ready','contentUpdated','errorOccurred','formSubmit','actionTriggered','stepChanged','fileUploadChanged','fileSelected','controlChanged','modalResult'];
function show(name,detail){let t;try{t=JSON.stringify(detail,(k,v)=>v instanceof Node||v instanceof Event?'['+v.constructor.name+']':v)}catch(e){t=String(detail)}
 const li=document.createElement('li');li.innerHTML='<b></b> <span></span>';li.firstChild.textContent=name;li.lastChild.textContent=(t||'').slice(0,300);log.prepend(li)}
// Los listeners van ANTES de cargar el script, para no perder 'ready'.
EVENTS.forEach(n=>viewer.addEventListener(n,e=>show(n,e.detail)));
for(const k of Object.keys(SCHEMAS))sel.add(new Option(k,k));
function load(){viewer.errorClass=sel.value==='Tailwind'?'border-red-500 ring-2 ring-red-500':'is-invalid';viewer.successClass=sel.value==='Tailwind'?'border-green-500':'is-valid';current=structuredClone(SCHEMAS[sel.value]);viewer.localSchema=structuredClone(current);status.textContent=sel.value}
sel.onchange=load;
function change(type){const c=current.filter(s=>s.renderType===type);const t=type==='dynamic'?c[c.length-1]:c[0];
 if(!t||!viewer.updateSections){status.textContent='No hay sección '+type+' en este ejemplo';return}
 t.htmlComponent=t.htmlComponent.replace(/<small class="stamp">.*?<\/small>/,'');
 t.htmlComponent=t.htmlComponent.replace(/(<\/(?:span|footer|nav|div|p|form)>)$/,'<small class="stamp"> · actualizada '+new Date().toLocaleTimeString()+'</small>$1');
 viewer.updateSections([structuredClone(t)])}
document.getElementById('dyn').onclick=()=>change('dynamic');
document.getElementById('sta').onclick=()=>change('static');
document.getElementById('clear').onclick=()=>log.replaceChildren();
</script>
