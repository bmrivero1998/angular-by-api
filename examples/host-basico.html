<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ux-driven-viewer · host básico</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
  <!--
    Host mínimo, sin Angular ni build. Para probarlo:
      1. npm run build:runtime      (genera dist/elements/ux-driven-viewer.js)
      2. npx http-server . -p 8080  (o cualquier servidor estático, desde la raíz del repo)
      3. abre http://localhost:8080/examples/host-basico.html
  -->
  <ux-driven-viewer id="viewer" scroll-offset="56"></ux-driven-viewer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- SIN type="module": zone.js necesita el scope global clásico. -->
  <script src="../dist/elements/ux-driven-viewer.js"></script>
  <script>
    const viewer = document.getElementById('viewer');

    viewer.addEventListener('actionTriggered', (e) => console.log('actionTriggered', e.detail));
    viewer.addEventListener('formSubmit', (e) => console.log('formSubmit', e.detail));
    viewer.addEventListener('errorOccurred', (e) => console.warn('errorOccurred', e.detail));

    fetch('./schemas/landing.json')
      .then((r) => r.json())
      .then((schema) => { viewer.localSchema = schema; });
  </script>
</body>
</html>
