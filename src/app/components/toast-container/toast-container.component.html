<div
  class="toast-container position-fixed top-0 end-0 p-3"
  style="z-index: 1200"
>
  <div
    *ngFor="let toast of toasts; index as i"
    class="toast"
    role="alert"
    aria-live="assertive"
    aria-atomic="true"
    [attr.data-bs-delay]="toast.delay || 5000"
    [ngClass]="toast.classname"
    #toastElement
  >
    <div class="d-flex">
      <div class="toast-body">
        {{ toast.message }}
      </div>
      <button
        type="button"
        class="btn-close me-2 m-auto"
        (click)="remove(i)"
        aria-label="Close"
      ></button>
    </div>
  </div>
</div>
