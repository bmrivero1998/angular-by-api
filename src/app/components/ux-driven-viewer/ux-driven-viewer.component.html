<div class="ux-widget-container">

  <!-- ========================================== -->
  <!-- 1. CONTENIDO ESTÁTICO (Siempre visible)    -->
  <!-- ========================================== -->
  <ng-container *ngIf="staticContent$ | async as staticItems">
    <ng-container *ngFor="let item of staticItems">
      <ng-container *ngTemplateOutlet="viewerTemplate; context: { $implicit: item, type: 'static' }">
      </ng-container>
    </ng-container>
  </ng-container>

  <!-- ========================================== -->
  <!-- 2. ESTADO DE CARGA (Centrado)              -->
  <!-- ========================================== -->
  <div *ngIf="isLoading" class="loading-state col-span-12 d-flex flex-column align-items-center justify-content-center py-5" style="grid-column: span 12;">
    <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;">
      <span class="visually-hidden">Cargando...</span>
    </div>
    <p class="mt-3 text-muted fw-bold">Cargando formulario...</p>
  </div>

  <!-- ========================================== -->
  <!-- 3. CONTENIDO DINÁMICO (Oculto al cargar)   -->
  <!-- ========================================== -->
  <ng-container *ngIf="!isLoading">
    <ng-container *ngIf="dynamicContent$ | async as dynamicItems">
      <ng-container *ngFor="let item of dynamicItems">
        <ng-container *ngTemplateOutlet="viewerTemplate; context: { $implicit: item, type: 'dynamic' }">
        </ng-container>
      </ng-container>
    </ng-container>
  </ng-container>

</div>

<!-- ========================================== -->
<!-- TEMPLATE REUTILIZABLE (Motor de Render)    -->
<!-- ========================================== -->
<ng-template #viewerTemplate let-item let-type="type">
  <app-dynamic-viewer
    [class]="type + '-' + item.id_DocumentHTMLCSS"
    [style.grid-column]="'span ' + (item.otros?.source?.colSpan || 12)"
    
    [contentId]="item.id_DocumentHTMLCSS"
    [htmlContentString]="item.htmlComponent"
    [cssContentString]="item.cssComponent"
    
    [dataBindings]="item.dataBindings"
    [buttonConfigs]="item.buttonConfigs"
    
    [formMappings]="item.formMappings"
    [formInitialData]="item.formInitialData"
    [formId]="item.formId || item.id_DocumentHTMLCSS"
    
    [parentForm]="formGroup"
    
    (actionClicked)="handleViewerActionClick($event)"
    (componentError)="errorOccurred.emit($event)"
    (formSubmitted)="onFormSubmitted($event)"
    (fileSelected)="fileSelected.emit($event)">
  </app-dynamic-viewer>
</ng-template>
