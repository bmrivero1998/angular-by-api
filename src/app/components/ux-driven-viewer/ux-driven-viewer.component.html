<style>
  :host { 
    display: block; 
    width: 100%; 
    box-sizing: border-box;
  }

  /* 🛡️ FALLBACK GRID SYSTEM (Nativo) 
     Este grid siempre está ahí, si el CSS de la IA viene roto,
     estas reglas de 'rescate' mantienen la estructura de 12 columnas.
  */
  .ux-widget-container {
    display: grid !important;
    grid-template-columns: repeat(12, 1fr) !important;
    gap: var(--ux-gap, 1rem); /* Gap por defecto */
    width: 100%;
  }

  /* Aseguramos que los Bricks hijos no se desparramen */
  app-dynamic-viewer {
    grid-column: span 12; /* Por defecto ocupan todo si la IA no dice lo contrario */
    display: block;
    min-height: 50px; /* Evita colapsos visuales totales */
  }
</style>

<div class="ux-widget-container" [class.grid-system]="currentFramework === 'custom'">
  @for (item of displayableItems; track item.id_DocumentHTMLCSS) {
    <app-dynamic-viewer
      [class]="'dynamic-' + item.id_DocumentHTMLCSS"
      [style.grid-column]="'span ' + (item.otros?.source?.colSpan || 12)"
      [contentId]="item.id_DocumentHTMLCSS"
      [htmlContentString]="item.htmlComponent"
      [cssContentString]="item.cssComponent"
      [formId]="item.formId || item.id_DocumentHTMLCSS"
      [formMappings]="item.formMappings"
      [formInitialData]="item.formInitialData"
      [buttonConfigs]="item.buttonConfigs"
      [parentForm]="hasAForm"
      (formSubmitted)="onFormSubmitted($event)"
      (actionClicked)="onActionClicked($event)"
      (componentError)="onComponentError($event)">
    </app-dynamic-viewer>
  } @empty {
    @if (errorState) {
      <div style="color: #721c24; background-color: #f8d7da; border: 1px solid #f5c6cb; padding: 1rem; border-radius: 0.25rem;">
        <strong>UXDriven Error:</strong> No se pudo cargar el contenido del proyecto.
      </div>
    }
  }
</div>
