<div [ngStyle]="{ display: 'grid', 'grid-template-columns': 'repeat(12, 1fr)', gap: gridGap + 'px', width: '100%' }">

  <!-- ========================================== -->
  <!-- 1. CONTENIDO ESTÁTICO (Siempre visible)    -->
  <!-- ========================================== -->
  <ng-container *ngIf="staticContent$ | async as staticItems">
    <ng-container *ngFor="let item of staticItems">
      <ng-container *ngTemplateOutlet="viewerTemplate; context: { $implicit: item }">
      </ng-container>
    </ng-container>
  </ng-container>

  <!-- ========================================== -->
  <!-- 2. ESTADO DE CARGA (spinner CSS puro, sin depender de Bootstrap ni de nada externo) -->
  <!-- ========================================== -->
  <div *ngIf="isLoading" [ngStyle]="{ 'grid-column': 'span 12', display: 'flex', 'flex-direction': 'column', 'align-items': 'center', 'justify-content': 'center', padding: '48px 0' }">
    <div
      role="status"
      aria-label="Cargando"
      [ngStyle]="{
        width: '48px',
        height: '48px',
        border: '4px solid rgba(0,0,0,0.1)',
        'border-top-color': 'currentColor',
        'border-radius': '50%',
        animation: 'ux-spin 0.8s linear infinite'
      }">
    </div>
    <p [ngStyle]="{ 'margin-top': '12px' }">Cargando formulario...</p>
  </div>

  <!-- ========================================== -->
  <!-- 3. CONTENIDO DINÁMICO (Oculto al cargar)   -->
  <!-- ========================================== -->
  <ng-container *ngIf="!isLoading">
    <ng-container *ngIf="dynamicContent$ | async as dynamicItems">
      <ng-container *ngFor="let item of dynamicItems">
        <ng-container *ngTemplateOutlet="viewerTemplate; context: { $implicit: item }">
        </ng-container>
      </ng-container>
    </ng-container>
  </ng-container>

</div>

<!-- ========================================== -->
<!-- TEMPLATE REUTILIZABLE (Motor de Render)    -->
<!-- ========================================== -->
<ng-template #viewerTemplate let-item>
  <app-dynamic-viewer
    [class]="'dynamic-' + item.id_DocumentHTMLCSS"
    [style.grid-column]="'span ' + (item.otros?.source?.colSpan || 12)"

    [contentId]="item.id_DocumentHTMLCSS"
    [htmlContentString]="item.htmlComponent"
    [cssContentString]="item.cssComponent"

    [dataBindings]="item.dataBindings"
    [buttonConfigs]="item.buttonConfigs"

    [formMappings]="item.formMappings"
    [formInitialData]="item.formInitialData"
    [formId]="item.formId || item.id_DocumentHTMLCSS"

    [parentForm]="formGroup"
    [scrollOffset]="scrollOffset"

    (actionClicked)="handleViewerActionClick($event)"
    (componentError)="errorOccurred.emit($event)"
    (formSubmitted)="onFormSubmitted($event)"
    (fileSelected)="fileSelected.emit($event)"
    (controlValueChange)="handleControlValueChange($event)">
  </app-dynamic-viewer>
</ng-template>
